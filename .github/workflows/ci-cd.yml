name: Pac-Man CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      deploy:
        description: "Push scanned image to ECR and deploy to EKS"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: pacman-dev-app
  EKS_CLUSTER_NAME: pacman-dev
  K8S_NAMESPACE: pacman
  IMAGE_TAG: ${{ github.sha }}

jobs:
  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      TF_IN_AUTOMATION: "true"
      TF_DATA_DIR: /tmp/pacman-terraform-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: |
          terraform -chdir=terraform init \
            -backend=false \
            -input=false

      - name: Validate Terraform configuration
        run: terraform -chdir=terraform validate

  build-and-scan:
    name: Build and Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t pacman-ci:${IMAGE_TAG} \
            .

      - name: Verify container runs as non-root
        run: |
          USER_ID=$(docker run \
            --rm \
            --entrypoint id \
            pacman-ci:${IMAGE_TAG} \
            -u)

          echo "Container UID: ${USER_ID}"

          if [ "${USER_ID}" = "0" ]; then
            echo "ERROR: Container is running as root."
            exit 1
          fi

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pacman-ci:${{ env.IMAGE_TAG }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Save scanned image
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy == true) }}
        run: |
          docker save \
            pacman-ci:${IMAGE_TAG} \
            -o /tmp/pacman-image.tar

      - name: Upload scanned image artifact
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy == true) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pacman-image-${{ github.sha }}
          path: /tmp/pacman-image.tar
          retention-days: 1
          compression-level: 0

  deploy:
    name: Push and Deploy
    needs:
      - terraform-validate
      - build-and-scan

    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy == true) }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/pacman-dev-github-actions
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Download scanned image artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: pacman-image-${{ github.sha }}
          path: /tmp/pacman-image

      - name: Load scanned Docker image
        run: |
          docker load \
            -i /tmp/pacman-image/pacman-image.tar

      - name: Push immutable image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker tag \
            pacman-ci:${IMAGE_TAG} \
            "${IMAGE_URI}"

          docker push "${IMAGE_URI}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

      - name: Set up kubectl
        uses: Azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: "v1.34.1"

      - name: Configure EKS kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      # namespace.yaml, storage-class.yaml and enable-network-policy.yaml
      # are bootstrap resources managed by launch.py because they require
      # permissions outside the pacman namespace.
      - name: Apply namespace-scoped manifests
        run: |
          kubectl apply -f k8s/app-configmap.yaml
          kubectl apply -f k8s/mongo-service.yaml
          kubectl apply -f k8s/mongo-networkpolicy.yaml
          kubectl apply -f k8s/mongo-statefulset.yaml
          kubectl apply -f k8s/app-service.yaml

      - name: Verify MongoDB rollout
        run: |
          kubectl rollout status \
            statefulset/mongo \
            --namespace "${K8S_NAMESPACE}" \
            --timeout=300s

      - name: Render Pac-Man deployment
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path

          source = Path("k8s/app-deployment.yaml").read_text()
          placeholder = "PACMAN_IMAGE_PLACEHOLDER"

          if source.count(placeholder) != 1:
              raise SystemExit(
                  "Expected exactly one PACMAN_IMAGE_PLACEHOLDER"
              )

          rendered = source.replace(
              placeholder,
              os.environ["IMAGE_URI"],
          )

          Path("/tmp/app-deployment.yaml").write_text(rendered)
          PYTHON

      - name: Apply Pac-Man deployment
        run: |
          kubectl apply -f /tmp/app-deployment.yaml

      - name: Verify Pac-Man rollout
        run: |
          kubectl rollout status \
            deployment/pacman \
            --namespace "${K8S_NAMESPACE}" \
            --timeout=180s
